  - Initial decoding/retry choices are recorded in ADR-0010 and APP-001 contract; actual provider capability and applied values must be recorded per run.
  - Price reference is the official rate card observed on 2026-11-05; use response usage cache-hit/cache-miss counts and the rate period applicable to the request timestamp. Never estimate if those inputs are unavailable.
