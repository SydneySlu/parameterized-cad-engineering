notes:
  - DeepSeek seed was accepted in two identical short non-evaluation requests (HTTP 200); this records parameter support only and does not establish deterministic output guarantees.
  - Ollama 0.33.2 `/api/show` confirmed qwen3:8b family, 8.2B, Q4_K_M and a template; two short probes accepted `think: false`, JSON format, `temperature=0`, `top_p=1`, `num_predict=8`, and `seed=271828`, returned valid JSON, and exposed no thinking field. This is capability evidence only; no reply text was saved.
  - Official API docs identify the request model as deepseek-flash and its documented model version as DeepSeek-V4.1-Flash-1017; runtime response.model still must be captured during a permitted probe.
  - The documented Chat Completion response has model and usage fields but no provider field; store configured_provider=DeepSeek and runtime_returned_provider=not_exposed unless actual responses expose one elsewhere.
  - One minimal non-evaluation runtime probe was made with thinking disabled. The project owner has now selected thinking disabled for the first formal cloud baseline; every request must explicitly send this setting because the API default is enabled.
  - Initial decoding/retry choices are recorded in ADR-0010 and APP-001 contract; actual provider capability and applied values must be recorded per run.
  - Price reference is the official rate card observed on 2026-11-05; use response usage cache-hit/cache-miss counts and the rate period applicable to the request timestamp. Never estimate if those inputs are unavailable.
